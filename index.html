<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KS Animax · Henley Pharmacy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit;text-decoration:none}
.site{max-width:900px;margin:0 auto;padding:0 20px 80px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-size:20px;font-weight:700}
.logo span{color:#00d4aa}
.hero{position:relative;border-radius:16px;overflow:hidden;margin:0 0 32px;height:280px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.hero h1{font-size:36px;font-weight:700;margin:0 0 4px}
.hero p{font-size:16px;color:rgba(255,255,255,.8);margin:0}
.section{margin:0 0 40px}
.section h2{font-size:20px;font-weight:600;margin:0 0 16px;color:#00d4aa}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.char{background:#16161d;border-radius:12px;overflow:hidden;text-align:center}
.char img{width:100%;height:160px;object-fit:cover;object-position:top}
.char .name{padding:10px;font-size:14px;font-weight:600}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.video-card{background:#16161d;border-radius:12px;overflow:hidden}
.video-card .thumb{height:160px;background:#222;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px}
.video-card .info{padding:14px}
.video-card h3{font-size:15px;font-weight:600;margin:0 0 4px}
.video-card p{font-size:13px;color:#888;margin:0}
.foot{margin-top:48px;padding-top:20px;border-top:1px solid #222;color:#555;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="site">
  <div class="bar">
    <span class="logo">KS <span>Animax</span></span>
  </div>

  <div class="hero">
    <img src="images/hp-front.jpg" alt="Henley Pharmacy">
    <div class="overlay">
      <h1>Henley Pharmacy</h1>
      <p>AI-generated training animations</p>
    </div>
  </div>

  <div class="section">
    <h2>Characters</h2>
    <div class="chars">
      <div class="char">
        <img src="images/tina.jpg" alt="Tina">
        <div class="name">Tina</div>
      </div>
      <div class="char">
        <img src="images/leo.jpg" alt="Leo">
        <div class="name">Leo</div>
      </div>
      <div class="char">
        <img src="images/marcus.jpg" alt="Marcus">
        <div class="name">Marcus</div>
      </div>
      <div class="char">
        <img src="images/sophia.jpg" alt="Sophia">
        <div class="name">Sophia</div>
      </div>
      <div class="char">
        <img src="images/wingman.jpg" alt="Wing Man">
        <div class="name">Wing Man</div>
      </div>
      <div class="char">
        <img src="images/mingyat.jpg" alt="Ming Yat Heung">
        <div class="name">Ming Yat Heung</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Animations</h2>
    <div class="videos">
      <div class="video-card">
        <div class="thumb">Coming soon</div>
        <div class="info">
          <h3>03 Hiring</h3>
          <p>Pharmacy assistant interview scene</p>
        </div>
      </div>
      <div class="video-card">
        <div class="thumb">Coming soon</div>
        <div class="info">
          <h3>07 First Day</h3>
          <p>First day training scene</p>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">KS Animax · AI-generated training content</div>
</div>
</body>
</html>
