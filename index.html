<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KS Animax</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit;text-decoration:none}
.site{max-width:800px;margin:0 auto;padding:0 20px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font-size:20px;font-weight:700}
.logo span{color:#00d4aa}
h1{font-size:32px;font-weight:700;margin:8px 0 4px}
.sub{color:#888;font-size:15px;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#1a1a22;border-radius:12px;overflow:hidden}
.card video{width:100%;display:block;background:#000}
.card .info{padding:14px}
.card h3{font-size:16px;font-weight:600;margin:0 0 4px}
.card p{font-size:13px;color:#888;margin:0}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid #222;color:#666;font-size:13px}
</style>
</head>
<body>
<div class="site">
  <div class="bar">
    <span class="logo">KS <span>Animax</span></span>
  </div>
  <h1>Animax</h1>
  <p class="sub">AI-generated training animations</p>
  <div class="grid" id="videos">
    <!-- Videos will be added here -->
  </div>
  <div class="foot">KS Animax · AI-generated training content</div>
</div>
</body>
</html>
